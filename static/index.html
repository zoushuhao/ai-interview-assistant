<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 求职助手 · 知识库问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #eef4fb 0%, #e8eef5 100%);
            min-height: 100vh;
            color: #1f2937;
        }
        /* ===== 顶部横幅 ===== */
        header {
            background: linear-gradient(120deg, #0f3d5c 0%, #1b6e8c 60%, #2a9d8f 100%);
            color: #fff;
            padding: 28px 20px;
            text-align: center;
        }
        header h1 { font-size: 26px; letter-spacing: 2px; }
        header p { margin-top: 8px; font-size: 14px; opacity: 0.85; }
        /* ===== 主体 ===== */
        main {
            max-width: 880px;
            margin: 24px auto 60px;
            padding: 0 16px;
        }
        /* ===== Tab ===== */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #fff;
            color: #64748b;
            transition: all 0.2s;
        }
        .tab.active {
            background: #1b6e8c;
            color: #fff;
            box-shadow: 0 4px 12px rgba(27, 110, 140, 0.25);
        }
        .tab:hover:not(.active) { background: #e2e8f0; }
        /* ===== 面板 ===== */
        .panel { display: none; }
        .panel.active { display: block; }
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(15, 61, 92, 0.08);
        }
        /* ===== 消息区 ===== */
        .msg-list {
            height: 420px;
            overflow-y: auto;
            padding: 8px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            margin-bottom: 14px;
        }
        .msg {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg.user {
            margin-left: auto;
            background: #1b6e8c;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        /* ===== 输入区 ===== */
        .input-row { display: flex; gap: 10px; }
        .input-row input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .input-row input:focus { border-color: #1b6e8c; }
        .input-row button {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            background: #1b6e8c;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-row button:hover { background: #155d75; }
        .input-row button:disabled { background: #94a3b8; cursor: not-allowed; }
        /* ===== 求职助手 ===== */
        .hint {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 14px;
            padding: 10px 14px;
            background: #f0f9ff;
            border-left: 4px solid #1b6e8c;
            border-radius: 6px;
        }
        .match-box {
            margin-top: 14px;
            padding: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.9;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 120px;
        }
        .match-box.placeholder { color: #94a3b8; }
        /* ===== 滚动条美化 ===== */
        .msg-list::-webkit-scrollbar { width: 6px; }
        .msg-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>

<header>
    <h1>AI 求职助手</h1>
    <p>知识库问答 · 岗位匹配 · 面试题生成 —— 你的私人求职顾问</p>
</header>

<main>
    <div class="tabs">
        <button class="tab active" data-tab="qa">知识库问答</button>
        <button class="tab" data-tab="match">求职助手</button>
    </div>

    <!-- 面板 1：知识库问答 -->
    <section id="qa" class="panel active">
        <div class="card">
            <div id="chat-box" class="msg-list"></div>
            <div class="input-row">
                <input id="question" placeholder="问问你的面试知识库，例如：RAG是什么？" />
                <button id="send">发送</button>
            </div>
        </div>
    </section>

    <!-- 面板 2：求职助手 -->
    <section id="match" class="panel">
        <div class="card">
            <p class="hint">输入你的技能清单或一段简历原文，AI 会帮你：搜真实岗位 → 算匹配度 → 列补齐方案 → 出面试题</p>
            <div class="input-row">
                <input id="match-input" placeholder="例如：我掌握 Python、LangChain、RAG，帮我看看适合什么岗位" />
                <button id="match-btn">开始匹配</button>
            </div>
            <div id="match-result" class="match-box placeholder">结果会显示在这里...</div>
        </div>
    </section>
</main>

<script>
    // ========== 工具函数：发请求（和 requests.post 一样） ==========
    async function ask(url, body) {
        const resp = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        return await resp.json();
    }

    // ========== Tab 切换 ==========
    const tabs = document.querySelectorAll(".tab");
    tabs.forEach(tab => {
        tab.onclick = function () {
            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
            document.getElementById(tab.dataset.tab).classList.add("active");
        };
    });

    // ========== 知识库问答 ==========
    const chatBox = document.getElementById("chat-box");
    const questionInput = document.getElementById("question");
    const sendBtn = document.getElementById("send");

    function addMsg(text, who) {
        const div = document.createElement("div");
        div.className = "msg " + who;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.onclick = async function () {
        const q = questionInput.value.trim();
        if (!q) return;
        addMsg(q, "user");
        questionInput.value = "";
        sendBtn.disabled = true;
        sendBtn.textContent = "思考中...";
        try {
            const data = await ask("/chat", { question: q });
            addMsg(data.answer || "（没有返回内容）", "ai");
        } catch (e) {
            addMsg("请求失败：" + e.message + "（服务在运行吗？）", "ai");
        }
        sendBtn.disabled = false;
        sendBtn.textContent = "发送";
    };

    // 回车发送
    questionInput.onkeydown = function (e) {
        if (e.key === "Enter") sendBtn.onclick();
    };

    // ========== 求职助手 ==========
    const matchInput = document.getElementById("match-input");
    const matchBtn = document.getElementById("match-btn");
    const matchResult = document.getElementById("match-result");

    matchBtn.onclick = async function () {
        const text = matchInput.value.trim();
        if (!text) return;
        matchResult.classList.remove("placeholder");
        matchResult.textContent = "AI 正在分析你的技能，请稍候（可能要搜真实岗位）...";
        matchBtn.disabled = true;
        matchBtn.textContent = "分析中...";
        try {
            const data = await ask("/match", { text: text });
            matchResult.textContent = data.answer || "（没有返回内容）";
        } catch (e) {
            matchResult.textContent = "请求失败：" + e.message + "（服务在运行吗？）";
        }
        matchBtn.disabled = false;
        matchBtn.textContent = "开始匹配";
    };

    // 回车触发
    matchInput.onkeydown = function (e) {
        if (e.key === "Enter") matchBtn.onclick();
    };
</script>

</body>
</html>
